version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: football_platform_db_prod
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-football_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5443:5432"
    networks:
      - football_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI 后端
  backend:
    build:
      context: ./backend-server
      dockerfile: Dockerfile
    container_name: football_platform_backend_prod
    environment:
      TZ: Asia/Shanghai
      ENV: prod
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-football_platform}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "8031:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/backups/football_platform:/app/backups
    networks:
      - football_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vue 前端
  frontend:
    build:
      context: ./frontend-pc
      dockerfile: Dockerfile
    container_name: football_platform_frontend_prod
    ports:
      - "8032:80"
    depends_on:
      - backend
    networks:
      - football_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  football_network:
    driver: bridge
